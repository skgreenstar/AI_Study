<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AI Study 대학원 학기별 과목 디렉토리">
<title>대학원 | AI Study</title>
<style>
:root{--bg:#f7f5ff;--ink:#202038;--muted:#6b6980;--violet:#7357e8;--pink:#ef6797;--line:#e8e3f7;--shadow:0 18px 50px rgba(60,42,120,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{word-break:keep-all;overflow-wrap:break-word;margin:0;background:radial-gradient(circle at 10% 0,#eee4ff,transparent 32%),radial-gradient(circle at 100% 90%,#ffe8f1,transparent 30%),var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;line-height:1.6}.wrap{max-width:1160px;margin:auto;padding:28px 22px 90px}.back{display:inline-flex;gap:8px;align-items:center;color:var(--muted);text-decoration:none;font-weight:850;margin-bottom:24px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#251553,#6543cf 58%,#9d64e8);color:#fff;border-radius:32px;padding:48px;box-shadow:var(--shadow)}.hero:after{content:"🎓";position:absolute;right:42px;top:22px;font-size:130px;opacity:.12;transform:rotate(8deg)}.eyebrow{font-size:13px;font-weight:900;letter-spacing:1.5px;opacity:.75}.hero h1{font-size:clamp(40px,7vw,68px);line-height:1;margin:12px 0 17px;letter-spacing:-2px}.hero p{max-width:620px;font-size:18px;opacity:.9;margin:0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:48px 2px 18px}.section-head h2{font-size:clamp(27px,4vw,40px);margin:0;letter-spacing:-1px}.section-head p{color:var(--muted);margin:0}
.semesters{display:flex;gap:14px;min-height:410px}.semester{display:flex;min-width:76px;flex:0 0 76px;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);transition:flex .35s ease}.semester.active{flex:1}.semester-tab{width:76px;flex:0 0 76px;border:0;background:linear-gradient(180deg,#372071,#7657e8);color:#fff;padding:20px 14px;cursor:pointer;font:inherit;font-weight:950;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:space-between}.semester-tab small{font-weight:700;opacity:.7}.semester-panel{display:none;min-width:0;flex:1;padding:26px}.semester.active .semester-panel{display:block}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:19px}.panel-title h3{font-size:26px;margin:0}.badge{white-space:nowrap;background:#eee9ff;color:#5b42b5;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:900}.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.course{--accent:var(--violet);display:flex;flex-direction:column;min-height:265px;background:#faf9ff;border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:20px;padding:20px;color:inherit;text-decoration:none;transition:.2s}.course.link:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 15px 30px rgba(60,42,120,.1)}.course-icon{font-size:30px}.course h4{font-size:19px;line-height:1.35;margin:15px 0 8px}.course p{color:var(--muted);font-size:14px;margin:0}.course-status{margin-top:auto;padding-top:18px;color:var(--accent);font-size:13px;font-weight:900}.edit-guide{display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px;margin-top:28px;padding:25px 28px;background:#211640;color:#fff;border-radius:22px}.edit-guide h3{margin:0 0 5px}.edit-guide p{margin:0;opacity:.75}.edit-guide a{white-space:nowrap;background:#fff;color:#332269;padding:10px 16px;border-radius:99px;text-decoration:none;font-weight:900}.error{padding:40px;text-align:center;color:#b03755;background:#fff0f4;border-radius:20px}
@media(max-width:800px){.hero{padding:38px 28px}.hero:after{right:10px;font-size:95px}.section-head{align-items:start;flex-direction:column}.semesters{display:block;min-height:0}.semester{display:block;min-width:0;flex:none;margin-bottom:12px}.semester.active{display:block}.semester-tab{width:100%;height:auto;writing-mode:horizontal-tb;flex:none;flex-direction:row;padding:16px 20px}.semester-panel{padding:20px}.courses{grid-template-columns:1fr}.course{min-height:210px}.edit-guide{grid-template-columns:1fr}.edit-guide a{justify-self:start}}
@media(max-width:520px){.wrap{padding:15px 14px 60px}.hero{border-radius:24px}.semester-panel{padding:16px}.panel-title{align-items:start;flex-direction:column}}
</style></head><body><main class="wrap">
<a class="back" href="../index.html">← AI Study 홈</a>
<header class="hero"><div class="eyebrow">GRADUATE SCHOOL</div><h1 id="page-title">대학원</h1><p id="page-desc">학기별 과목과 학습 자료를 한곳에서 관리합니다.</p></header>
<section><div class="section-head"><h2>학기별 학습 공간</h2><p>학기를 누르면 과목이 펼쳐집니다.</p></div><div class="semesters" id="semesters" aria-live="polite"></div></section>
<aside class="edit-guide"><div><h3>내용 수정은 JSON 하나로</h3><p>학기와 과목을 추가·수정하면 이 화면이 자동으로 다시 구성됩니다.</p></div><a href="../data/graduate-curriculum.json">데이터 파일 열기 →</a></aside>
</main>
<script>
const DATA_URL='../data/graduate-curriculum.json';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function courseCard(c){const tag=c.href?'a':'article',href=c.href?` href="${esc(c.href)}"`:'',linked=c.href?' link':'';return `<${tag} class="course${linked}" style="--accent:${esc(c.color||'#7357e8')}"${href}><span class="course-icon">${esc(c.icon||'📘')}</span><h4>${esc(c.title)}</h4><p>${esc(c.description||'')}</p><span class="course-status">${esc(c.status||'자료 준비 중')}${c.href?' →':''}</span></${tag}>`}
function render(data){document.getElementById('page-title').textContent=data.page?.title||'대학원';document.getElementById('page-desc').textContent=data.page?.description||'';const root=document.getElementById('semesters');root.innerHTML=(data.semesters||[]).map((s,i)=>`<section class="semester ${i===0?'active':''}" data-id="${esc(s.id)}"><button class="semester-tab" type="button" aria-expanded="${i===0}"><b>${esc(s.shortLabel||s.label)}</b><small>${esc(s.status||'')}</small></button><div class="semester-panel"><div class="panel-title"><h3>${esc(s.label)}</h3><span class="badge">${(s.courses||[]).length}개 과목</span></div><div class="courses">${(s.courses||[]).map(courseCard).join('')}</div></div></section>`).join('');root.querySelectorAll('.semester-tab').forEach(btn=>btn.addEventListener('click',()=>{const target=btn.closest('.semester'),open=!target.classList.contains('active');root.querySelectorAll('.semester').forEach(x=>{x.classList.remove('active');x.querySelector('button').setAttribute('aria-expanded','false')});if(open){target.classList.add('active');btn.setAttribute('aria-expanded','true')}}))}
fetch(DATA_URL).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(render).catch(()=>{document.getElementById('semesters').innerHTML='<div class="error">과목 데이터를 불러오지 못했습니다. data/graduate-curriculum.json을 확인해 주세요.</div>'});
</script></body></html>
