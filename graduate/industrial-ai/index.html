<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="산업 AI의 기초 주차별 학습 자료"><title>산업 AI의 기초 | AI Study</title>
<style>
:root{--bg:#f6faf9;--ink:#172632;--muted:#63717b;--mint:#22a98f;--navy:#163b57;--line:#dce9e5;--shadow:0 18px 48px rgba(28,78,73,.10)}*{box-sizing:border-box}body{word-break:keep-all;overflow-wrap:break-word;margin:0;background:radial-gradient(circle at 10% 0,#dff8f1,transparent 32%),var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;line-height:1.65}.wrap{max-width:1080px;margin:auto;padding:28px 20px 90px}.back{display:inline-block;color:var(--muted);text-decoration:none;font-weight:850;margin-bottom:24px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#102e46,#176c72 62%,#27aa91);color:#fff;border-radius:30px;padding:46px;box-shadow:var(--shadow)}.hero:after{content:"🏭";position:absolute;right:38px;top:12px;font-size:135px;opacity:.12}.eyebrow{font-size:13px;font-weight:900;letter-spacing:1.4px;opacity:.75}.hero h1{font-size:clamp(35px,6vw,60px);line-height:1.05;letter-spacing:-2px;margin:12px 0 17px}.hero p{max-width:670px;font-size:18px;opacity:.9;margin:0}.heading{display:flex;justify-content:space-between;align-items:end;margin:45px 2px 18px}.heading h2{font-size:clamp(27px,4vw,38px);margin:0}.heading span{color:var(--muted)}.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.week{--accent:var(--mint);display:flex;flex-direction:column;min-height:285px;background:#fff;color:inherit;text-decoration:none;border:1px solid var(--line);border-left:7px solid var(--accent);border-radius:22px;padding:25px;box-shadow:var(--shadow);transition:.2s}.week:hover{transform:translateY(-5px);border-color:var(--accent)}.top{display:flex;align-items:center;justify-content:space-between}.number{font-size:13px;font-weight:950;color:var(--accent);letter-spacing:.7px}.icon{font-size:30px}.week h3{font-size:24px;line-height:1.3;margin:18px 0 7px}.week p{margin:0;color:var(--muted)}.topics{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.topics span{background:#eff8f6;color:#28695f;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800}.status{margin-top:auto;padding-top:18px;color:var(--accent);font-weight:900}.empty,.error{padding:42px;text-align:center;background:#fff;border:2px dashed var(--line);border-radius:22px;color:var(--muted)}.edit{margin-top:26px;padding:22px 25px;border-radius:20px;background:#163b57;color:#fff}.edit b{display:block;font-size:19px}.edit p{margin:5px 0 0;opacity:.72}@media(max-width:700px){.hero{padding:35px 25px}.hero:after{right:5px;font-size:100px}.heading{align-items:start;flex-direction:column}.weeks{grid-template-columns:1fr}.week{min-height:250px}}
</style></head><body><main class="wrap"><a class="back" href="../index.html">← 대학원 · 2026년 2학기</a>
<header class="hero"><div class="eyebrow" id="semester">2026년 2학기</div><h1 id="title">산업 AI의 기초</h1><p id="description">주차별 자료를 불러오고 있습니다.</p></header>
<div class="heading"><h2>주차별 학습</h2><span id="count"></span></div><section class="weeks" id="weeks" aria-live="polite"></section>
<aside class="edit"><b>주차 추가는 JSON 하나로</b><p>data/industrial-ai-course.json에 주차 정보를 추가하면 카드가 자동으로 생성됩니다.</p></aside></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
fetch('../../data/industrial-ai-course.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{document.getElementById('semester').textContent=data.course.semester;document.getElementById('title').textContent=data.course.title;document.getElementById('description').textContent=data.course.description;document.getElementById('count').textContent=(data.weeks||[]).length+'개 주차';document.getElementById('weeks').innerHTML=(data.weeks||[]).map(w=>`<a class="week" href="${esc(w.href)}" style="--accent:${esc(w.color||'#22a98f')}"><div class="top"><span class="number">WEEK ${esc(w.week)}</span><span class="icon">${esc(w.icon||'📘')}</span></div><h3>${esc(w.title)}</h3><p>${esc(w.subtitle||'')}</p><div class="topics">${(w.topics||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="status">${esc(w.status||'학습 가능')} →</div></a>`).join('')||'<div class="empty">등록된 주차가 없습니다.</div>'}).catch(()=>{document.getElementById('weeks').innerHTML='<div class="error">주차 데이터를 불러오지 못했습니다.</div>'});
</script></body></html>
