<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="디퓨전과 거대비전모델 주차별 시각 학습 자료"><title>디퓨전과 거대비전모델 | AI Study</title>
<style>
:root{--bg:#f8f5ff;--ink:#211c38;--muted:#6e6881;--violet:#7657e8;--pink:#e45d9d;--line:#e7dff6;--shadow:0 18px 48px rgba(65,40,125,.11)}*{box-sizing:border-box}body{word-break:keep-all;overflow-wrap:break-word;margin:0;background:radial-gradient(circle at 8% 0,#eee4ff,transparent 32%),radial-gradient(circle at 100% 90%,#ffe5f1,transparent 28%),var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;line-height:1.65}.wrap{max-width:1080px;margin:auto;padding:28px 20px 90px}.back{display:inline-block;color:var(--muted);text-decoration:none;font-weight:850;margin-bottom:24px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#28135f,#6d42d3 60%,#d4519a);color:#fff;border-radius:30px;padding:46px;box-shadow:var(--shadow)}.hero:after{content:"✦";position:absolute;right:42px;top:8px;font-size:145px;opacity:.12}.eyebrow{font-size:13px;font-weight:900;letter-spacing:1.4px;opacity:.75}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.06;letter-spacing:-2px;margin:12px 0 17px}.hero p{max-width:680px;font-size:18px;opacity:.9;margin:0}.prereq{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:24px;padding:20px 23px;border:1px solid #dccff5;background:#fff;border-radius:20px;box-shadow:var(--shadow)}.prereq h3{margin:0 0 4px}.prereq p{margin:0;color:var(--muted)}.prereq a{white-space:nowrap;text-decoration:none;background:var(--violet);color:#fff;border-radius:99px;padding:10px 16px;font-weight:900}.heading{display:flex;justify-content:space-between;align-items:end;margin:45px 2px 18px}.heading h2{font-size:clamp(27px,4vw,38px);margin:0}.heading span{color:var(--muted)}.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.week{--accent:var(--violet);display:flex;flex-direction:column;min-height:285px;background:#fff;color:inherit;text-decoration:none;border:1px solid var(--line);border-left:7px solid var(--accent);border-radius:22px;padding:25px;box-shadow:var(--shadow);transition:.2s}.week:hover{transform:translateY(-5px);border-color:var(--accent)}.top{display:flex;align-items:center;justify-content:space-between}.number{font-size:13px;font-weight:950;color:var(--accent)}.icon{font-size:30px}.week h3{font-size:24px;line-height:1.3;margin:18px 0 7px}.week p{margin:0;color:var(--muted)}.topics{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.topics span{background:#f2edff;color:#5e43b5;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800}.status{margin-top:auto;padding-top:18px;color:var(--accent);font-weight:900}.edit{margin-top:26px;padding:22px 25px;border-radius:20px;background:#24134e;color:#fff}.edit b{display:block;font-size:19px}.edit p{margin:5px 0 0;opacity:.72}.error{padding:40px;text-align:center;background:#fff0f5;color:#a52f5c;border-radius:20px}@media(max-width:700px){.hero{padding:35px 25px}.hero:after{right:5px;font-size:100px}.prereq{align-items:start;flex-direction:column}.heading{align-items:start;flex-direction:column}.weeks{grid-template-columns:1fr}.week{min-height:250px}}
</style></head><body><main class="wrap"><a class="back" href="../index.html">← 대학원 · 2026년 2학기</a>
<header class="hero"><div class="eyebrow" id="semester">2026년 2학기</div><h1 id="title">디퓨전과 거대비전모델</h1><p id="description">주차별 자료를 불러오고 있습니다.</p></header>
<aside class="prereq"><div><h3>🧩 디퓨전이 처음이라면?</h3><p>확률·분포·노이즈·신경망을 먼저 시각적으로 채울 수 있습니다.</p></div><a id="prerequisite" href="../../topics/diffusion-prerequisites.html">선수지식 전체 보기 →</a></aside>
<div class="heading"><h2>주차별 학습</h2><span id="count"></span></div><section class="weeks" id="weeks" aria-live="polite"></section>
<aside class="edit"><b>주차 추가는 JSON 하나로</b><p>data/diffusion-lvm-course.json에 주차 정보를 추가하면 카드가 자동으로 생성됩니다.</p></aside></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
fetch('../../data/diffusion-lvm-course.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{document.getElementById('semester').textContent=data.course.semester;document.getElementById('title').textContent=data.course.title;document.getElementById('description').textContent=data.course.description;document.getElementById('prerequisite').href=data.course.prerequisiteHref;document.getElementById('count').textContent=(data.weeks||[]).length+'개 주차';document.getElementById('weeks').innerHTML=(data.weeks||[]).map(w=>`<a class="week" href="${esc(w.href)}" style="--accent:${esc(w.color||'#7657e8')}"><div class="top"><span class="number">WEEK ${esc(w.week)}</span><span class="icon">${esc(w.icon||'📘')}</span></div><h3>${esc(w.title)}</h3><p>${esc(w.subtitle||'')}</p><div class="topics">${(w.topics||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="status">${esc(w.status||'학습 가능')} →</div></a>`).join('')}).catch(()=>{document.getElementById('weeks').innerHTML='<div class="error">주차 데이터를 불러오지 못했습니다.</div>'});
</script></body></html>
