<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AI Study 대학교 학기별 과목 및 시간표"><title>대학교 | AI Study</title><style>
:root{--bg:#f7f5ff;--ink:#202038;--muted:#6b6980;--violet:#7357e8;--line:#e8e3f7;--shadow:0 18px 50px rgba(60,42,120,.1)}*{box-sizing:border-box}body{word-break:keep-all;overflow-wrap:break-word;margin:0;background:radial-gradient(circle at 10% 0,#e5efff,transparent 32%),radial-gradient(circle at 100% 90%,#e3fff7,transparent 30%),var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;line-height:1.6}.wrap{max-width:1160px;margin:auto;padding:28px 22px 90px}.back{display:inline-block;color:var(--muted);text-decoration:none;font-weight:850;margin-bottom:24px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#193a68,#426fb4 58%,#49ad9d);color:#fff;border-radius:32px;padding:48px;box-shadow:var(--shadow)}.hero:after{content:"🏫";position:absolute;right:38px;top:13px;font-size:130px;opacity:.13}.eyebrow{font-size:13px;font-weight:900;letter-spacing:1.5px;opacity:.76}.hero h1{font-size:clamp(40px,7vw,68px);line-height:1;margin:12px 0 17px}.hero p{max-width:650px;font-size:18px;opacity:.9;margin:0}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:48px 2px 18px}.head h2{font-size:clamp(27px,4vw,40px);margin:0}.head p{color:var(--muted);margin:0}.semester{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.semester-tab{width:100%;border:0;background:linear-gradient(90deg,#294f92,#4f7cff);color:#fff;padding:19px 23px;cursor:pointer;font:inherit;display:flex;justify-content:space-between;align-items:center;text-align:left}.semester-tab b{font-size:20px}.semester-tab span:after{content:"⌄";display:inline-block;margin-left:10px;font-size:22px;transition:.2s}.semester:not(.active) .semester-tab span:after{transform:rotate(-90deg)}.semester-panel{padding:23px}.semester:not(.active) .semester-panel{display:none}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.badge{background:#edf2ff;color:#365ea4;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:900}.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.course{--accent:#7357e8;display:flex;flex-direction:column;min-height:285px;padding:21px;border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:20px;background:#fbfaff;color:inherit;text-decoration:none}.course.link:hover{transform:translateY(-4px);border-color:var(--accent)}.course-icon{font-size:30px}.course h3{font-size:21px;margin:13px 0 6px}.course p{color:var(--muted);font-size:14px;margin:0}.meetings{display:grid;gap:7px;margin-top:15px}.meeting{display:grid;grid-template-columns:30px 96px 1fr;gap:7px;align-items:center;padding:8px 9px;border-radius:11px;background:#f2f0f9;font-size:12px}.day{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--accent);color:#fff;font-weight:950}.note{margin-top:15px;padding:9px;border-radius:11px;background:#fff6dd;color:#77550b;font-size:12px}.status{margin-top:auto;padding-top:16px;color:var(--accent);font-size:13px;font-weight:900}.edit{margin-top:27px;padding:23px 26px;border-radius:21px;background:#182b4b;color:#fff}.edit p{margin:5px 0 0;opacity:.73}.error{padding:40px;text-align:center;color:#b03755}@media(max-width:720px){.wrap{padding:15px 14px 60px}.hero{padding:37px 26px}.hero:after{right:5px;font-size:90px}.head{align-items:start;flex-direction:column}.semester-panel{padding:15px}.courses{grid-template-columns:1fr}.course{min-height:260px}.meeting{grid-template-columns:30px 90px 1fr}}@media(max-width:430px){.meeting{grid-template-columns:30px 1fr}.meeting .place{grid-column:2}}</style></head><body><main class="wrap"><a class="back" href="../index.html">← AI Study 홈</a><header class="hero"><div class="eyebrow">UNIVERSITY COURSES</div><h1 id="title">대학교</h1><p id="desc">학기별 과목과 시간표를 중복 없이 관리합니다.</p></header><section><div class="head"><h2>학기별 수업</h2><p>학기를 누르면 과목과 시간표가 펼쳐집니다.</p></div><div id="semesters"></div></section><aside class="edit"><b>수업 추가는 JSON 하나로</b><p>data/university-curriculum.json에서 학기·과목·수업시간을 수정하면 이 화면이 자동으로 갱신됩니다.</p></aside></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function meetings(c){if(c.meetings?.length)return '<div class="meetings">'+c.meetings.map(m=>'<div class="meeting"><span class="day">'+esc(m.day)+'</span><b>'+esc(m.time)+'</b><span class="place">'+esc(m.place)+'</span></div>').join("")+'</div>';return '<div class="note">'+esc(c.scheduleNote||"수업시간 미정")+'</div>'}
function card(c){const tag=c.href?"a":"article",href=c.href?' href="'+esc(c.href)+'"':"";return '<'+tag+' class="course '+(c.href?"link":"")+'" style="--accent:'+esc(c.color||"#7357e8")+'"'+href+'><span class="course-icon">'+esc(c.icon||"📘")+'</span><h3>'+esc(c.title)+'</h3><p>'+esc(c.description||"")+'</p>'+meetings(c)+'<span class="status">'+esc(c.status||"자료 준비 중")+(c.href?" →":"")+'</span></'+tag+'>'}
fetch("../data/university-curriculum.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{document.getElementById("title").textContent=data.page.title;document.getElementById("desc").textContent=data.page.description;document.getElementById("semesters").innerHTML=(data.semesters||[]).map((s,i)=>'<section class="semester '+(i===0?"active":"")+'"><button class="semester-tab" type="button" aria-expanded="'+(i===0)+'"><b>'+esc(s.label)+'</b><span>'+esc(s.status||"")+'</span></button><div class="semester-panel"><div class="panel-title"><b>'+esc(s.shortLabel||s.label)+'</b><span class="badge">'+s.courses.length+'개 과목</span></div><div class="courses">'+s.courses.map(card).join("")+'</div></div></section>').join("");document.querySelectorAll(".semester-tab").forEach(b=>b.onclick=()=>{const s=b.closest(".semester"),o=!s.classList.contains("active");s.classList.toggle("active",o);b.setAttribute("aria-expanded",String(o))})}).catch(()=>document.getElementById("semesters").innerHTML='<div class="error">수업 데이터를 불러오지 못했습니다.</div>');
</script></body></html>
